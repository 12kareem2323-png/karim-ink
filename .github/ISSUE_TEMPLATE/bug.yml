name: Bug report
description: Report a reproducible problem in the Mac or Windows Test.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, tokens, private drawings or personal information. This issue is public. Report security vulnerabilities privately."
  - type: input
    id: version
    attributes:
      label: App, OS and processor
      placeholder: "SketchGlide 0.2.0 Test; Windows/macOS version; processor"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
