name: Bug report
description: Report a reproducible problem in the Mac preview.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, tokens, private drawings or personal information. This issue is public. Report security vulnerabilities privately."
  - type: input
    id: version
    attributes:
      label: App and macOS version
      placeholder: "Karim Ink 0.1.0; macOS version; Apple Silicon Mac model"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
